<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>心飞健康 · 登录</title>
        <meta name="description" content="心飞健康">
        <meta name="keywords" content="心飞健康">
        <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">
        <link rel="stylesheet" href="plugins/elementui/index.css">
        <link rel="stylesheet" href="css/tokens.css">
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
                min-height: 100vh;
            }
            /* #app 是 body 的唯一子元素，必须自己开 flex，否则左右分栏不生效 */
            #app.login-shell {
                display: flex;
                width: 100%;
                min-height: 100vh;
            }
            /* ---------- 左侧品牌区：水平 + 垂直都居中 ---------- */
            .brand-side {
                flex: 1.15;
                position: relative;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
                padding: var(--space-8);
                color: #fff;
                background: var(--brand-gradient-deep);
            }
            /* 两枚柔光斑，避免大色块显得空 */
            .brand-side::before,
            .brand-side::after {
                content: '';
                position: absolute;
                border-radius: 50%;
                background: rgba(255, 255, 255, .07);
                pointer-events: none;
            }
            .brand-side::before { width: 460px; height: 460px; top: -160px; left: -140px; }
            .brand-side::after { width: 340px; height: 340px; bottom: -130px; right: -100px; background: rgba(255, 255, 255, .05); }
            /* logo.svg 是 360×96 的横版组合标（已含中英文），按宽度等比放大；
               标志本身是蓝色渐变，压在绿底上对比不足，所以垫一张白卡承托 */
            .brand-logo {
                position: relative;
                width: 340px;
                max-width: 100%;
                padding: var(--space-6) var(--space-8);
                background: var(--bg-card);
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow-float);
            }
            .brand-logo img { display: block; width: 100%; height: auto; }
            .brand-headline {
                position: relative;
                margin-top: var(--space-8);
                font-size: 30px;
                font-weight: 600;
                letter-spacing: 3px;
            }
            .brand-slogan {
                position: relative;
                margin-top: var(--space-3);
                font-size: var(--font-size-md);
                letter-spacing: 6px;
                opacity: .8;
            }
            .brand-divider {
                position: relative;
                width: 48px;
                height: 2px;
                margin-top: var(--space-8);
                background: rgba(255, 255, 255, .45);
                border-radius: 2px;
            }
            .brand-points {
                position: relative;
                display: flex;
                gap: var(--space-6);
                margin-top: var(--space-4);
                font-size: var(--font-size-sm);
                opacity: .82;
            }
            /* ---------- 右侧表单区 ---------- */
            .login-side {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: var(--space-8) var(--space-4);
                background: var(--bg-page);
            }
            .login-card {
                width: 420px;
                max-width: 100%;
                padding: 40px 36px 32px;
                background: var(--bg-card);
                border: 1px solid var(--border-base);
                border-radius: var(--radius-lg);
                box-shadow: 0 12px 40px rgba(31, 35, 41, .07);
            }
            .login-card .card-title {
                font-size: 24px;
                font-weight: 600;
                color: var(--text-title);
            }
            .login-card .card-sub {
                margin: var(--space-2) 0 var(--space-6);
                font-size: var(--font-size-sm);
                color: var(--text-secondary);
            }
            .login-card input {
                width: 100%;
                height: 46px;
                padding: 0 14px;
                border: 1px solid var(--border-base);
                border-radius: var(--radius-sm);
                font-size: 14px;
                color: var(--text-body);
                outline: none;
                transition: border-color .2s, box-shadow .2s;
            }
            .login-card input::placeholder { color: var(--text-disabled); }
            .login-card input:focus {
                border-color: var(--brand-primary);
                box-shadow: 0 0 0 3px var(--brand-primary-light);
            }
            .login-card .field { margin-bottom: var(--space-4); }
            /* 验证码行：输入框 + 图片并排，点图片刷新 */
            .captcha-row { display: flex; gap: var(--space-3); }
            .captcha-row input { flex: 1; min-width: 0; }
            .captcha-row img {
                width: 130px;
                height: 46px;
                border: 1px solid var(--border-base);
                border-radius: var(--radius-sm);
                cursor: pointer;
                background: var(--bg-card);
                transition: border-color .2s;
            }
            .captcha-row img:hover { border-color: var(--brand-primary); }
            .login-card .field-error {
                margin: calc(var(--space-1) - var(--space-2)) 0 var(--space-3);
                font-size: var(--font-size-sm);
                color: var(--status-danger);
                min-height: 18px;
            }
            .login-card button {
                width: 100%;
                height: 46px;
                background: var(--brand-gradient);
                color: #fff;
                border: none;
                border-radius: var(--radius-sm);
                font-size: 15px;
                letter-spacing: 4px;
                cursor: pointer;
                transition: box-shadow .2s, filter .2s, transform .1s;
            }
            .login-card button:hover:not(:disabled) {
                filter: brightness(1.06);
                box-shadow: 0 6px 18px rgba(0, 168, 112, .28);
            }
            .login-card button:active:not(:disabled) { transform: translateY(1px); }
            .login-card button:disabled { opacity: .6; cursor: not-allowed; }
            .login-card .card-foot {
                margin-top: var(--space-4);
                text-align: center;
                font-size: var(--font-size-xs);
                color: var(--text-disabled);
            }
            /* ---------- 窄屏：上下堆叠，品牌区压缩 ---------- */
            @media (max-width: 900px) {
                #app.login-shell { flex-direction: column; }
                .brand-side { flex: none; padding: var(--space-6) var(--space-4); }
                .brand-logo { width: 240px; padding: var(--space-4) var(--space-6); }
                .brand-headline { margin-top: var(--space-4); font-size: 20px; letter-spacing: 2px; }
                .brand-slogan, .brand-divider, .brand-points { display: none; }
                .login-side { flex: 1; }
            }
        </style>
    </head>
    <body>
        <div id="app" class="login-shell">
            <!-- 左侧品牌区 -->
            <div class="brand-side">
                <div class="brand-logo">
                    <img src="img/logo.svg" alt="心飞健康">
                </div>
                <div class="brand-headline">让健康管理更简单</div>
                <div class="brand-slogan">XINFEI HEALTH</div>
                <div class="brand-divider"></div>
                <div class="brand-points">
                    <span>套餐管理</span>
                    <span>预约设置</span>
                    <span>体质辨识</span>
                    <span>运营报表</span>
                </div>
            </div>
            <!-- 右侧登录表单 -->
            <div class="login-side">
                <form class="login-card" @submit.prevent="doLogin">
                    <div class="card-title">登录管理系统</div>
                    <div class="card-sub">心飞健康体检预约管理平台</div>
                    <div class="field">
                        <input v-model.trim="username" name="username" type="text" placeholder="请输入用户名" autocomplete="username" />
                    </div>
                    <div class="field">
                        <input v-model="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" @keyup.enter="doLogin" />
                    </div>
                    <div v-if="captchaEnabled" class="field captcha-row">
                        <input v-model.trim="code" name="code" type="text" placeholder="请输入验证码" maxlength="6" @keyup.enter="doLogin" />
                        <img v-if="captchaImg" :src="'data:image/png;base64,' + captchaImg" alt="验证码" title="点击刷新" @click="loadCaptcha" />
                    </div>
                    <div class="field-error">{{ error }}</div>
                    <button type="submit" :disabled="loading">{{ loading ? '登录中…' : '登 录' }}</button>
                    <div class="card-foot">心飞健康 · 内部管理平台</div>
                </form>
            </div>
        </div>
        <script src="js/vue.js"></script>
        <script src="plugins/elementui/index.js"></script>
        <script src="js/axios-0.18.0.js"></script>
        <script src="js/config.js"></script>
        <script src="js/api.js"></script>
        <script>
            new Vue({
                el: '#app',
                data: {
                    username: '',
                    password: '',
                    code: '',
                    uuid: '',
                    captchaEnabled: false,
                    captchaImg: '',
                    error: '',
                    loading: false
                },
                created() {
                    this.loadCaptcha();
                },
                methods: {
                    loadCaptcha() {
                        axios.get('/auth/code').then(response => {
                            let data = response.data || {};
                            this.captchaEnabled = !!data.captchaEnabled;
                            this.captchaImg = data.img || '';
                            this.uuid = data.uuid || '';
                            this.code = '';
                        }).catch(() => {
                            this.captchaEnabled = false;
                        });
                    },
                    doLogin() {
                        if (!this.username || !this.password) {
                            this.error = '请输入用户名和密码';
                            return;
                        }
                        if (this.captchaEnabled && !this.code) {
                            this.error = '请输入验证码';
                            return;
                        }
                        this.loading = true;
                        this.error = '';
                        // 后端登录入口是 POST /auth/login（JSON），不是旧站的 /login.do
                        axios.post('/auth/login', {
                            clientId: XfjkConfig.clientId,
                            grantType: 'password',
                            username: this.username,
                            password: this.password,
                            code: this.code,
                            uuid: this.uuid
                        }, {
                            headers: { 'ClientID': XfjkConfig.clientId }
                        }).then(response => {
                            let data = response.data || {};
                            if (!data.access_token) {
                                this.error = '登录响应缺少访问令牌';
                                this.loadCaptcha();
                                return;
                            }
                            XfjkAuth.signin(data.access_token, this.username);
                            window.location.href = (window.XfjkConfig && window.XfjkConfig.homePage) || '/pages/index.html';
                        }).catch(err => {
                            this.error = (err && err.message) || '登录失败';
                            // 验证码是一次性的，失败后必须换一张
                            this.loadCaptcha();
                        }).finally(() => {
                            this.loading = false;
                        });
                    }
                }
            })
        </script>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>心飞健康 · 预约列表</title>
        <meta name="description" content="心飞健康">
        <meta name="keywords" content="心飞健康">
        <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">
        <link rel="stylesheet" href="../plugins/elementui/index.css">
        <link rel="stylesheet" href="../plugins/font-awesome/css/font-awesome.min.css">
        <link rel="stylesheet" href="../css/tokens.css">
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body class="hold-transition">
        <div id="app" class="page-wrap">
            <h1 class="page-title">预约列表</h1>

            <!-- 筛选卡片 -->
            <div class="page-card">
                <el-form :inline="true" size="small" @submit.native.prevent>
                    <el-form-item>
                        <el-input placeholder="会员姓名 / 手机号" v-model="pagination.queryString" style="width: 240px;" clearable @clear="findPage()" @keyup.enter.native="findPage()"></el-input>
                    </el-form-item>
                    <el-form-item>
                        <el-date-picker v-model="queryDate" type="month" placeholder="预约月份" value-format="yyyy-MM" style="width: 140px;" @change="findPage()"></el-date-picker>
                    </el-form-item>
                    <el-form-item>
                        <el-button icon="el-icon-search" @click="findPage()">查询</el-button>
                    </el-form-item>
                </el-form>
            </div>

            <!-- 表格卡片 -->
            <div class="page-card">
                <div class="page-card-header">
                    <span class="page-card-title">预约记录</span>
                    <span class="list-total">共 {{ pagination.total }} 条</span>
                </div>
                <el-table size="small" :data="dataList" highlight-current-row>
                    <el-table-column type="index" label="序号" width="60" align="center"></el-table-column>
                    <el-table-column prop="memberName" label="会员姓名" align="left"></el-table-column>
                    <el-table-column prop="phoneNumber" label="手机号" align="left" width="140"></el-table-column>
                    <el-table-column prop="setmealName" label="体检套餐" align="left" show-overflow-tooltip></el-table-column>
                    <el-table-column prop="orderDate" label="预约日期" align="center" width="120"></el-table-column>
                    <el-table-column label="预约状态" align="center" width="100">
                        <template slot-scope="scope">
                            <el-tag :type="scope.row.orderStatus == '1' ? 'success' : 'warning'" size="mini">{{ scope.row.orderStatus == '1' ? '已到检' : '未到检' }}</el-tag>
                        </template>
                    </el-table-column>
                    <el-table-column label="操作" align="center" width="120">
                        <template slot-scope="scope">
                            <el-button v-if="scope.row.orderStatus != '1'" type="text" class="op-primary" @click="handleCheckin(scope.row)">到检登记</el-button>
                            <el-button type="text" class="op-danger" @click="handleCancel(scope.row)">取消预约</el-button>
                        </template>
                    </el-table-column>
                </el-table>
                <div class="pagination-container">
                    <el-pagination
                        background
                        layout="total, prev, pager, next, jumper"
                        :current-page.sync="pagination.currentPage"
                        :page-size="pagination.pageSize"
                        :total="pagination.total"
                        @current-change="handleCurrentChange">
                    </el-pagination>
                </div>
            </div>
        </div>

        <!-- 引入组件库 -->
        <script src="../js/vue.js"></script>
        <script src="../plugins/elementui/index.js"></script>
        <script type="text/javascript" src="../js/jquery.min.js"></script>
        <script src="../js/axios-0.18.0.js"></script>
        <script src="../js/config.js"></script>
        <script src="../js/api.js"></script>
        <script>
            let vue = new Vue({
                el: '#app',
                data: {
                    pagination: {
                        currentPage: 1,
                        pageSize: 10,
                        total: 0,
                        queryString: null
                    },
                    queryDate: null,
                    dataList: []
                },
                created() {
                    this.findPage();
                },
                methods: {
                    // 分页查询（legacy 后端无预约列表接口，占位数据；接口设计见文档 08）
                    findPage() {
                        // TODO: 后端新增预约列表接口后替换为 axios 请求（文档 08 接口清单）
                        this.dataList = [
                            { id: 1, memberName: '张三', phoneNumber: '13800000001', setmealName: '常规体检套餐', orderDate: '2026-10-22', orderStatus: '0' },
                            { id: 2, memberName: '李四', phoneNumber: '13800000002', setmealName: '入职体检套餐', orderDate: '2026-10-15', orderStatus: '1' },
                            { id: 3, memberName: '王五', phoneNumber: '13800000003', setmealName: '尊贵VIP套餐', orderDate: '2026-10-25', orderStatus: '0' }
                        ];
                        this.pagination.total = this.dataList.length;
                    },
                    // 到检登记
                    handleCheckin(row) {
                        this.$confirm('确认为会员「' + row.memberName + '」办理到检登记？', '提示', {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning'
                        }).then(() => {
                            // TODO: 接入后端接口后替换为 axios 请求
                            row.orderStatus = '1';
                            this.$message.success('到检登记成功（占位，接口待接入）');
                        }).catch(() => {
                        });
                    },
                    // 取消预约
                    handleCancel(row) {
                        this.$confirm('是否取消会员「' + row.memberName + '」' + row.orderDate + ' 的预约？', '提示', {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning'
                        }).then(() => {
                            // TODO: 接入后端接口后替换为 axios 请求
                            this.$message.success('已取消预约（占位，接口待接入）');
                            this.findPage();
                        }).catch(() => {
                        });
                    },
                    handleCurrentChange(currentPage) {
                        this.pagination.currentPage = currentPage;
                        this.findPage();
                    }
                }
            })
        </script>
    </body>
</html>

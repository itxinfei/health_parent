<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>心飞健康 · 检查项管理</title>
        <meta name="description" content="心飞健康">
        <meta name="keywords" content="心飞健康">
        <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">
        <link rel="stylesheet" href="../plugins/elementui/index.css">
        <link rel="stylesheet" href="../plugins/font-awesome/css/font-awesome.min.css">
        <link rel="stylesheet" href="../css/tokens.css">
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body class="hold-transition">
        <div id="app" class="page-wrap">
            <h1 class="page-title">检查项管理</h1>

            <!-- 筛选卡片 -->
            <div class="page-card">
                <el-form :inline="true" size="small" @submit.native.prevent>
                    <el-form-item>
                        <el-input placeholder="项目编码 / 项目名称" v-model="pagination.queryString" style="width: 240px;" clearable @clear="findPage()" @keyup.enter.native="findPage()"></el-input>
                    </el-form-item>
                    <el-form-item>
                        <el-button icon="el-icon-search" @click="findPage()">查询</el-button>
                        <el-button type="primary" icon="el-icon-plus" @click="handleCreate()">新建检查项</el-button>
                    </el-form-item>
                </el-form>
            </div>

            <!-- 表格卡片 -->
            <div class="page-card">
                <div class="page-card-header">
                    <span class="page-card-title">检查项列表</span>
                    <span class="list-total">共 {{ pagination.total }} 条</span>
                </div>
                <el-table size="small" :data="dataList" highlight-current-row>
                    <el-table-column type="index" label="序号" width="60" align="center"></el-table-column>
                    <el-table-column prop="code" label="项目编码" align="left"></el-table-column>
                    <el-table-column prop="name" label="项目名称" align="left"></el-table-column>
                    <el-table-column label="适用性别" align="center" width="90">
                        <template slot-scope="scope">
                            <span>{{ scope.row.sex == '0' ? '不限' : scope.row.sex == '1' ? '男' : '女'}}</span>
                        </template>
                    </el-table-column>
                    <el-table-column prop="age" label="适用年龄" align="center" width="90"></el-table-column>
                    <el-table-column prop="remark" label="项目说明" align="left" show-overflow-tooltip></el-table-column>
                    <el-table-column label="操作" align="center" width="130">
                        <template slot-scope="scope">
                            <el-button type="text" class="op-primary" @click="handleUpdate(scope.row)">编辑</el-button>
                            <el-button type="text" class="op-danger" @click="handleDelete(scope.row)">删除</el-button>
                        </template>
                    </el-table-column>
                </el-table>
                <div class="pagination-container">
                    <el-pagination
                        background
                        layout="total, prev, pager, next, jumper"
                        :current-page.sync="pagination.currentPage"
                        :page-size="pagination.pageSize"
                        :total="pagination.total"
                        @current-change="handleCurrentChange">
                    </el-pagination>
                </div>
            </div>

            <!-- 新增弹窗 -->
            <div class="add-form">
                <el-dialog title="新增检查项" :visible.sync="dialogFormVisible" custom-class="unified-dialog" width="560px">
                    <el-form ref="dataAddForm" :model="formData" :rules="rules" label-position="right" label-width="100px">
                        <el-row>
                            <el-col :span="12">
                                <el-form-item label="项目编码" prop="code">
                                    <el-input v-model="formData.code" style="width: 293px;"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="项目名称" prop="name">
                                    <el-input v-model="formData.name" style="width: 293px;"></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>
                        <el-row>
                            <el-col :span="12">
                                <el-form-item label="性别">
                                    <el-select v-model="formData.sex" style="width: 293px;">
                                        <el-option label="不限" value="0"></el-option>
                                        <el-option label="男" value="1"></el-option>
                                        <el-option label="女" value="2"></el-option>
                                    </el-select>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="适用年龄">
                                    <el-input v-model="formData.age" style="width: 293px;"></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>
                        <el-row>
                            <el-col :span="12">
                                <el-form-item label="类型">
                                    <el-select v-model="formData.type" style="width: 293px;">
                                        <el-option label="检查" value="1"></el-option>
                                        <el-option label="检验" value="2"></el-option>
                                    </el-select>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="价格">
                                    <el-input v-model="formData.price" style="width: 293px;"></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>
                        <el-row>
                            <el-col :span="24">
                                <el-form-item label="项目说明">
                                    <el-input v-model="formData.remark" type="textarea"></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>
                        <el-row>
                            <el-col :span="24">
                                <el-form-item label="注意事项">
                                    <el-input v-model="formData.attention" type="textarea"></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>
                    </el-form>
                    <div slot="footer" class="dialog-footer">
                        <el-button @click="dialogFormVisible = false">取消</el-button>
                        <el-button type="primary" @click="handleAdd()">确定</el-button>
                    </div>
                </el-dialog>
            </div>

            <!-- 编辑弹窗 -->
            <div class="add-form">
                <el-dialog title="编辑检查项" :visible.sync="dialogFormVisible4Edit" custom-class="unified-dialog" width="560px">
                    <el-form ref="dataEditForm" :model="formData" :rules="rules" label-position="right" label-width="100px">
                        <el-row>
                            <el-col :span="12">
                                <el-form-item label="项目编码" prop="code">
                                    <el-input v-model="formData.code" style="width: 293px;"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="项目名称" prop="name">
                                    <el-input v-model="formData.name" style="width: 293px;"></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>
                        <el-row>
                            <el-col :span="12">
                                <el-form-item label="性别">
                                    <el-select v-model="formData.sex" style="width: 293px;">
                                        <el-option label="不限" value="0"></el-option>
                                        <el-option label="男" value="1"></el-option>
                                        <el-option label="女" value="2"></el-option>
                                    </el-select>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="适用年龄">
                                    <el-input v-model="formData.age" style="width: 293px;"></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>
                        <el-row>
                            <el-col :span="12">
                                <el-form-item label="类型">
                                    <el-select v-model="formData.type" style="width: 293px;">
                                        <el-option label="检查" value="1"></el-option>
                                        <el-option label="检验" value="2"></el-option>
                                    </el-select>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="价格">
                                    <el-input v-model="formData.price" style="width: 293px;"></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>
                        <el-row>
                            <el-col :span="24">
                                <el-form-item label="项目说明">
                                    <el-input v-model="formData.remark" type="textarea"></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>
                        <el-row>
                            <el-col :span="24">
                                <el-form-item label="注意事项">
                                    <el-input v-model="formData.attention" type="textarea"></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>
                    </el-form>
                    <div slot="footer" class="dialog-footer">
                        <el-button @click="dialogFormVisible4Edit = false">取消</el-button>
                        <el-button type="primary" @click="handleEdit()">确定</el-button>
                    </div>
                </el-dialog>
            </div>
        </div>

        <!-- 引入组件库 -->
        <script src="../js/vue.js"></script>
        <script src="../plugins/elementui/index.js"></script>
        <script type="text/javascript" src="../js/jquery.min.js"></script>
        <script src="../js/axios-0.18.0.js"></script>
        <script src="../js/config.js"></script>
        <script src="../js/api.js"></script>
        <script>
            let vue = new Vue({
                el: '#app',
                data: {
                    pagination: {
                        currentPage: 1,
                        pageSize: 10,
                        total: 0,
                        queryString: null
                    },
                    dataList: [],
                    formData: {},
                    dialogFormVisible: false,
                    dialogFormVisible4Edit: false,
                    rules: {
                        code: [{ required: true, message: '项目编码为必填项', trigger: 'blur' }],
                        name: [{ required: true, message: '项目名称为必填项', trigger: 'blur' }]
                    }
                },
                created() {
                    this.findPage();
                },
                methods: {
                    handleEdit() {
                        axios.post(`/checkItem/update.do`, this.formData).then(response => {
                            if (response.data.flag) {
                                this.dialogFormVisible4Edit = false;
                                this.findPage();
                                this.$message.success("修改成功");
                            } else {
                                this.$message.error(response.data.message);
                            }
                        });
                    },
                    handleAdd() {
                        this.$refs['dataAddForm'].validate(valid => {
                            if (valid) {
                                axios.post(`/checkItem/add.do`, this.formData).then(response => {
                                    this.dialogFormVisible = false;
                                    if (response.data.flag) {
                                        this.$message.success(response.data.message);
                                    } else {
                                        this.$message.error(response.data.message);
                                    }
                                }).finally(() => {
                                    this.findPage();
                                })
                            } else {
                                this.$message.error("表单数据校验失败");
                                return false;
                            }
                        })
                    },
                    findPage() {
                        let params = {
                            currentPage: this.pagination.currentPage,
                            pageSize: this.pagination.pageSize,
                            queryString: this.pagination.queryString
                        };
                        axios.post(`/checkItem/findByPage.do`, params).then(response => {
                            this.dataList = response.data.rows;
                            this.pagination.total = response.data.total;
                        });
                    },
                    handleCreate() {
                        this.formData = {};
                        this.dialogFormVisible = true;
                    },
                    handleUpdate(row) {
                        this.dialogFormVisible4Edit = true;
                        let id = row.id;
                        axios.get(`/checkItem/findById.do?id=${id}`).then(response => {
                            this.formData = response.data;
                        })
                    },
                    handleCurrentChange(currentPage) {
                        this.pagination.currentPage = currentPage;
                        this.findPage();
                    },
                    handleDelete(row) {
                        let id = row.id;
                        this.$confirm('是否删除该项检查项？', '提示', {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning'
                        }).then(() => {
                            axios.get(`/checkItem/deleteCheckItem.do?id=${id}`).then(response => {
                                if (response.data.flag) {
                                    this.$message.success("删除成功");
                                    this.findPage();
                                } else {
                                    this.$message.warning(response.data.message);
                                }
                            });
                        }).catch(() => {
                        });
                    }
                }
            })
        </script>
    </body>
</html>

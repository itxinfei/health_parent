<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>心飞健康 · 预约设置</title>
        <meta name="description" content="心飞健康">
        <meta name="keywords" content="心飞健康">
        <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">
        <link rel="stylesheet" href="../plugins/elementui/index.css">
        <link rel="stylesheet" href="../plugins/font-awesome/css/font-awesome.min.css">
        <link rel="stylesheet" href="../css/tokens.css">
        <link rel="stylesheet" href="../css/style.css">
        <style>
            .calendar-grid { display: flex; flex-wrap: wrap; border-left: 1px solid var(--border-light, #ebeef5); border-top: 1px solid var(--border-light, #ebeef5); }
            .calendar-cell {
                width: 14.28%; box-sizing: border-box; min-height: 96px;
                border-right: 1px solid var(--border-light, #ebeef5);
                border-bottom: 1px solid var(--border-light, #ebeef5);
                padding: 8px; cursor: pointer; transition: background-color .15s;
            }
            .calendar-cell:hover { background-color: var(--color-primary-light-9, #ecf5ff); }
            .calendar-cell.is-empty { background: #fafafa; cursor: default; }
            .calendar-cell.is-full .calendar-remain { color: var(--color-danger, #f56c6c); font-weight: 600; }
            .calendar-day { font-size: 16px; font-weight: 600; color: var(--text-primary, #303133); }
            .calendar-quotas { margin-top: 6px; font-size: 12px; color: var(--text-secondary, #606266); line-height: 1.7; }
            .calendar-week { background: var(--bg-color, #f5f7fa); font-weight: 600; text-align: center; min-height: 36px; padding: 8px 0; cursor: default; }
        </style>
    </head>
    <body class="hold-transition">
        <div id="app" class="page-wrap">
            <h1 class="page-title">预约设置</h1>

            <!-- 工具卡片 -->
            <div class="page-card">
                <el-form :inline="true" size="small" @submit.native.prevent>
                    <el-form-item label="月份">
                        <el-date-picker v-model="currentMonth" type="month" value-format="yyyy-MM"
                                        :clearable="false" style="width: 150px;" @change="findPage()"></el-date-picker>
                    </el-form-item>
                    <el-form-item>
                        <el-button type="primary" icon="el-icon-upload2" @click="uploadVisible = true">Excel 导入</el-button>
                    </el-form-item>
                </el-form>
            </div>

            <!-- 月历卡片 -->
            <div class="page-card">
                <div class="page-card-header">
                    <span class="page-card-title">{{ currentMonth }} 可预约名额（点击日期设置）</span>
                    <span class="list-total">剩余 = 可预约 - 已预约</span>
                </div>
                <div class="calendar-grid">
                    <div class="calendar-cell calendar-week" v-for="w in weekHeads" :key="'w' + w">{{ w }}</div>
                    <div class="calendar-cell is-empty" v-for="n in leadingBlanks" :key="'b' + n"></div>
                    <div class="calendar-cell" :class="{ 'is-full': cell.remain === 0 }"
                         v-for="cell in calendarCells" :key="cell.date" @click="openSetDialog(cell)">
                        <div class="calendar-day">{{ cell.day }}</div>
                        <div class="calendar-quotas" v-if="cell.number !== null">
                            <div>可预约：{{ cell.number }}</div>
                            <div>已预约：{{ cell.reservations }}</div>
                            <div class="calendar-remain">剩余：{{ cell.remain }}</div>
                        </div>
                        <div class="calendar-quotas" v-else>
                            <div style="color: var(--text-placeholder, #c0c4cc);">未设置</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 单日设置弹窗 -->
            <div class="add-form">
                <el-dialog title="设置可预约人数" :visible.sync="setDialogVisible" custom-class="unified-dialog" width="420px">
                    <el-form ref="setForm" :model="setForm" :rules="setRules" label-position="right" label-width="110px">
                        <el-form-item label="预约日期">
                            <el-input :value="setForm.orderDate" disabled style="width: 220px;"></el-input>
                        </el-form-item>
                        <el-form-item label="可预约人数" prop="number">
                            <el-input-number v-model="setForm.number" :min="1" :max="9999" style="width: 220px;"></el-input-number>
                        </el-form-item>
                    </el-form>
                    <div slot="footer" class="dialog-footer">
                        <el-button v-if="setForm.exists" type="danger" plain @click="handleDeleteDay()">删除该日设置</el-button>
                        <el-button @click="setDialogVisible = false">取消</el-button>
                        <el-button type="primary" @click="handleSetNumber()">确定</el-button>
                    </div>
                </el-dialog>
            </div>

            <!-- Excel 导入弹窗 -->
            <div class="add-form">
                <el-dialog title="Excel 批量导入预约名额" :visible.sync="uploadVisible" custom-class="unified-dialog" width="480px">
                    <el-alert type="info" :closable="false" show-icon style="margin-bottom: 16px;"
                              title="仅导入晚于今天的日期；已设置的日期只更新可预约人数，不会重置已预约数。"></el-alert>
                    <el-upload drag action="" :auto-upload="false" :on-change="handleFileChange"
                               :file-list="fileList" accept=".xlsx,.xls" :limit="1">
                        <i class="el-icon-upload"></i>
                        <div class="el-upload__text">将文件拖到此处，或<em>点击选择</em></div>
                        <div class="el-upload__tip" slot="tip">两列：日期（如 2026-11-01）、可预约人数</div>
                    </el-upload>
                    <div slot="footer" class="dialog-footer">
                        <el-button @click="uploadVisible = false">取消</el-button>
                        <el-button type="primary" :disabled="!importFile" @click="handleImport()">开始导入</el-button>
                    </div>
                </el-dialog>
            </div>
        </div>

        <!-- 引入组件库 -->
        <script src="../js/vue.js"></script>
        <script src="../plugins/elementui/index.js"></script>
        <script type="text/javascript" src="../js/jquery.min.js"></script>
        <script src="../js/axios-0.18.0.js"></script>
        <script src="../js/config.js"></script>
        <script src="../js/api.js"></script>
        <script>
            let vue = new Vue({
                el: '#app',
                data: {
                    weekHeads: ['一', '二', '三', '四', '五', '六', '日'],
                    currentMonth: '',
                    quotaMap: {},
                    setDialogVisible: false,
                    setForm: { orderDate: '', number: 1, exists: false },
                    setRules: {
                        number: [{ required: true, message: '可预约人数为必填项', trigger: 'blur' }]
                    },
                    uploadVisible: false,
                    fileList: [],
                    importFile: null
                },
                computed: {
                    leadingBlanks() {
                        let parts = this.currentMonth.split('-');
                        let first = new Date(Number(parts[0]), Number(parts[1]) - 1, 1);
                        let dow = first.getDay(); // 0=周日
                        return (dow + 6) % 7; // 周一开头
                    },
                    calendarCells() {
                        let parts = this.currentMonth.split('-');
                        let year = Number(parts[0]), month = Number(parts[1]);
                        let days = new Date(year, month, 0).getDate();
                        let cells = [];
                        for (let d = 1; d <= days; d++) {
                            let date = this.currentMonth + '-' + String(d).padStart(2, '0');
                            let q = this.quotaMap[date];
                            cells.push({
                                date: date,
                                day: d,
                                number: q ? q.number : null,
                                reservations: q ? q.reservations : 0,
                                remain: q ? q.remain : null
                            });
                        }
                        return cells;
                    }
                },
                created() {
                    this.currentMonth = this.formatMonth(new Date());
                    this.findPage();
                },
                methods: {
                    formatMonth(d) {
                        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
                    },
                    findPage() {
                        let parts = this.currentMonth.split('-');
                        axios.get('/health/ordersettings', { params: { year: parts[0], month: parts[1] } }).then(response => {
                            let map = {};
                            (response.data || []).forEach(item => { map[item.orderDate] = item; });
                            this.quotaMap = map;
                        });
                    },
                    openSetDialog(cell) {
                        this.setForm = {
                            orderDate: cell.date,
                            number: cell.number === null ? 20 : cell.number,
                            exists: cell.number !== null
                        };
                        this.setDialogVisible = true;
                    },
                    handleSetNumber() {
                        axios.put('/health/ordersettings', {
                            orderDate: this.setForm.orderDate,
                            number: this.setForm.number
                        }).then(() => {
                            this.setDialogVisible = false;
                            this.$message.success('设置成功');
                            this.findPage();
                        });
                    },
                    handleDeleteDay() {
                        this.$confirm('删除后该日不再可预约，且该日存在订单时不可删除。是否继续？', '提示', {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning'
                        }).then(() => {
                            axios.delete('/health/ordersettings', { params: { orderDate: this.setForm.orderDate } }).then(() => {
                                this.setDialogVisible = false;
                                this.$message.success('删除成功');
                                this.findPage();
                            });
                        }).catch(() => {});
                    },
                    handleFileChange(file) {
                        this.importFile = file.raw;
                    },
                    handleImport() {
                        let formData = new FormData();
                        formData.append('file', this.importFile);
                        axios.post('/health/ordersettings/upload', formData).then(response => {
                            this.$message.success(response.data || '导入成功');
                            this.uploadVisible = false;
                            this.fileList = [];
                            this.importFile = null;
                            this.findPage();
                        });
                    }
                }
            })
        </script>
    </body>
</html>

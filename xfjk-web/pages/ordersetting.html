<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>心飞健康 · 预约设置</title>
        <meta name="description" content="心飞健康">
        <meta name="keywords" content="心飞健康">
        <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">
        <link rel="stylesheet" href="../plugins/elementui/index.css">
        <link rel="stylesheet" href="../plugins/font-awesome/css/font-awesome.min.css">
        <link rel="stylesheet" href="../css/tokens.css">
        <link rel="stylesheet" href="../css/orderset.css">
    </head>
    <body class="hold-transition">
        <div id="app" class="page-wrap">
            <h1 class="page-title">预约设置</h1>

            <!-- 批量导入卡片 -->
            <div class="page-card">
                <div class="page-card-header">
                    <span class="page-card-title">批量导入</span>
                </div>
                <div style="display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-3);">
                    <el-button size="small" icon="el-icon-download" @click="downloadTemplate()">模板下载</el-button>
                    <el-upload action="/ordersetting/upload.do"
                               name="excelFile"
                               :show-file-list="false"
                               :on-success="handleSuccess"
                               :before-upload="beforeUpload">
                        <el-button size="small" type="primary" icon="el-icon-upload2">上传文件</el-button>
                    </el-upload>
                </div>
                <div style="font-size: var(--font-size-xs); color: var(--text-secondary);">
                    操作说明：请点击"模板下载"获取模板文件，在模板文件中录入预约设置数据后点击"上传文件"上传。
                </div>
            </div>

            <!-- 预约日历卡片 -->
            <div class="page-card">
                <div class="calendar">
                    <!-- 年份 月份 -->
                    <div class="month">
                        <div class="currentdate">
                            <span class="choose-year">{{ currentYear }}年</span>
                            <span class="choose-month">{{ currentMonth }}月</span>
                        </div>
                        <div class="choose">
                            <span @click="goCurrentMonth(currentYear,currentMonth)" class="gotoday">今天</span>
                            <span @click="pickPre(currentYear,currentMonth)">❮</span>
                            <span @click="pickNext(currentYear,currentMonth)">❯</span>
                        </div>
                        <div class="clearfix"></div>
                    </div>
                    <!-- 星期 -->
                    <div class="caldate">
                        <ul class="weekdays">
                            <li>周一</li>
                            <li>周二</li>
                            <li>周三</li>
                            <li>周四</li>
                            <li>周五</li>
                            <li>周六</li>
                            <li>周日</li>
                        </ul>
                        <!-- 日期 -->
                        <ul class="days">
                            <li v-for="dayobject in days">
                                <template>
                                    <!-- 非当前月份 -->
                                    <div class="other-month" v-if="dayobject.day.getMonth()+1 != currentMonth">
                                        {{ dayobject.day.getDate() }}
                                    </div>
                                    <!-- 当前月 -->
                                    <div class="everyday" v-if="dayobject.day.getMonth()+1 == currentMonth">
                                        <span class="datenumber">{{ dayobject.day.getDate()}}</span>
                                        <template>
                                            <template v-for="obj in leftobj">
                                                <template v-if="obj.date == dayobject.day.getDate()">
                                                    <template v-if="obj.number > obj.reservations">
                                                        <div class="usual">
                                                            <p>可预约{{obj.number}}人</p>
                                                            <p>已预约{{obj.reservations}}人</p>
                                                        </div>
                                                    </template>
                                                    <template v-else>
                                                        <div class="fulled">
                                                            <p>可预约{{obj.number}}人</p>
                                                            <p>已预约{{obj.reservations}}人</p>
                                                            <p>已满</p>
                                                        </div>
                                                    </template>
                                                </template>
                                            </template>
                                            <button v-if="dayobject.day > today" @click="handleOrderSet(dayobject.day)" class="orderbtn">设置</button>
                                        </template>
                                    </div>
                                </template>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <!-- 引入组件库 -->
    <script src="../js/vue.js"></script>
    <script src="../plugins/elementui/index.js"></script>
    <script type="text/javascript" src="../js/jquery.min.js"></script>
    <script src="../js/axios-0.18.0.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script>
        new Vue({
            el: '#app',
            data: {
                today: new Date(),
                currentDay: 1,
                currentMonth: 1,
                LocalMonth: 1,
                currentYear: 1970,
                currentWeek: 1,
                days: [],
                leftobj: []
            },
            created: function () {
                this.initData(null);
            },
            methods: {
                // 预约设置
                handleOrderSet(day) {
                    this.$prompt('请输入可预约数量', '提示', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        inputPattern: /^[0-9]*[1-9][0-9]*$/,
                        inputErrorMessage: '只能输入正整数'
                    }).then(({ value }) => {
                        let orderDate = this.formatDate(day.getFullYear(), day.getMonth() + 1, day.getDate());
                        axios.post(`/ordersetting/update.do`, { orderDate: orderDate, number: value }).then(response => {
                            if (response.data.flag) {
                                this.initData(this.formatDate(day.getFullYear(), day.getMonth() + 1, 1));
                                this.$message.success(response.data.message);
                            } else {
                                this.$message.error(response.data.message);
                            }
                        })
                    }).catch(() => {
                    });
                },
                // 上传之前进行文件格式校验
                beforeUpload(file) {
                    const isXLS = file.type === 'application/vnd.ms-excel';
                    if (isXLS) {
                        return true;
                    }
                    const isXLSX = file.type === 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
                    if (isXLSX) {
                        return true;
                    }
                    this.$message.error('上传文件只能是xls或者xlsx格式!');
                    return false;
                },
                // 下载模板文件
                downloadTemplate() {
                    window.location.href = "../../template/ordersetting_template.xlsx";
                },
                // 上传成功提示
                handleSuccess(response) {
                    let r = XfjkApi.fromUpload(response);
                    if (r.ok) {
                        this.initData(null);
                        this.$message.success(r.text || '上传成功');
                    } else {
                        this.$message.error(r.text || '上传失败');
                    }
                },
                // 初始化当前页要展示的日期
                initData: function (cur) {
                    let date;
                    let index = 0;
                    if (cur) {
                        date = new Date(cur);
                    } else {
                        let now = new Date();
                        let d = new Date(this.formatDate(now.getFullYear(), now.getMonth(), 1));
                        d.setDate(35);
                        date = new Date(this.formatDate(d.getFullYear(), d.getMonth() + 1, 1));
                    }
                    this.currentDay = date.getDate();
                    this.currentYear = date.getFullYear();
                    this.currentMonth = date.getMonth() + 1;
                    this.currentWeek = date.getDay();
                    let today = new Date();
                    this.LocalMonth = today.getMonth() + 1;
                    if (this.currentWeek == 0) {
                        this.currentWeek = 7;
                    }
                    let str = this.formatDate(this.currentYear, this.currentMonth, this.currentDay);
                    this.days.length = 0;
                    for (let i = this.currentWeek - 1; i >= 0; i--) {
                        let d = new Date(str);
                        d.setDate(d.getDate() - i);
                        let dayobject = {};
                        dayobject.day = d;
                        let now = new Date();
                        if (d.getDate() === (now.getDate()) && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) {
                            dayobject.index = index++;
                        } else if (index != 0 && index < 3) {
                            dayobject.index = index++;
                        }
                        this.days.push(dayobject);
                    }
                    for (let i = 1; i <= 35 - this.currentWeek; i++) {
                        let d = new Date(str);
                        d.setDate(d.getDate() + i);
                        let dayobject = {};
                        dayobject.day = d;
                        let now = new Date();
                        if (d.getDate() === (now.getDate()) && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) {
                            dayobject.index = index++;
                        } else if (index != 0 && index < 3) {
                            dayobject.index = index++;
                        }
                        this.days.push(dayobject);
                    }

                    axios.get(`/ordersetting/findAll.do?currentYear=${this.currentYear}&currentMonth=${this.currentMonth}`).then(response => {
                        // 必须是数组：模板里 v-for 出的每一项都会读 obj.date
                        this.leftobj = Array.isArray(response.data) ? response.data : [];
                    })
                },
                // 切换到当前月份
                goCurrentMonth: function (year, month) {
                    let d = new Date();
                    this.initData(this.formatDate(d.getFullYear(), d.getMonth() + 1, 1));
                },
                // 向前一个月
                pickPre: function (year, month) {
                    let d = new Date(this.formatDate(year, month, 1));
                    d.setDate(0);
                    this.initData(this.formatDate(d.getFullYear(), d.getMonth() + 1, 1));
                },
                // 向后一个月
                pickNext: function (year, month) {
                    let d = new Date(this.formatDate(year, month, 1));
                    d.setDate(35);
                    this.initData(this.formatDate(d.getFullYear(), d.getMonth() + 1, 1));
                },
                // 返回 类似 2016-01-02 格式的字符串
                formatDate: function (year, month, day) {
                    let y = year;
                    let m = month;
                    if (m < 10) m = "0" + m;
                    let d = day;
                    if (d < 10) d = "0" + d;
                    return y + "-" + m + "-" + d
                }
            }
        })
    </script>
</html>

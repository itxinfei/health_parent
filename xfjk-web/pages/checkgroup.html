<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>心飞健康 · 检查组管理</title>
        <meta name="description" content="心飞健康">
        <meta name="keywords" content="心飞健康">
        <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">
        <link rel="stylesheet" href="../plugins/elementui/index.css">
        <link rel="stylesheet" href="../plugins/font-awesome/css/font-awesome.min.css">
        <link rel="stylesheet" href="../css/tokens.css">
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body class="hold-transition">
        <div id="app" class="page-wrap">
            <h1 class="page-title">检查组管理</h1>

            <!-- 筛选卡片 -->
            <div class="page-card">
                <el-form :inline="true" size="small" @submit.native.prevent>
                    <el-form-item>
                        <el-input placeholder="编码 / 名称 / 助记码" v-model="pagination.queryString" style="width: 240px;" clearable @clear="findPage()" @keyup.enter.native="findPage()"></el-input>
                    </el-form-item>
                    <el-form-item>
                        <el-button icon="el-icon-search" @click="findPage()">查询</el-button>
                        <el-button type="primary" icon="el-icon-plus" @click="handleCreate()">新建检查组</el-button>
                    </el-form-item>
                </el-form>
            </div>

            <!-- 表格卡片 -->
            <div class="page-card">
                <div class="page-card-header">
                    <span class="page-card-title">检查组列表</span>
                    <span class="list-total">共 {{ pagination.total }} 条</span>
                </div>
                <el-table size="small" :data="dataList" highlight-current-row>
                    <el-table-column type="index" label="序号" width="60" align="center"></el-table-column>
                    <el-table-column prop="code" label="检查组编码" align="left"></el-table-column>
                    <el-table-column prop="name" label="检查组名称" align="left"></el-table-column>
                    <el-table-column label="适用性别" align="center" width="90">
                        <template slot-scope="scope">
                            <span>{{ scope.row.sex == '0' ? '不限' : scope.row.sex == '1' ? '男' : '女'}}</span>
                        </template>
                    </el-table-column>
                    <el-table-column prop="helpCode" label="助记码" align="center" width="90"></el-table-column>
                    <el-table-column prop="remark" label="说明" align="left" show-overflow-tooltip></el-table-column>
                    <el-table-column label="操作" align="center" width="130">
                        <template slot-scope="scope">
                            <el-button type="text" class="op-primary" @click="handleUpdate(scope.row)">编辑</el-button>
                            <el-button type="text" class="op-danger" @click="handleDelete(scope.row)">删除</el-button>
                        </template>
                    </el-table-column>
                </el-table>
                <div class="pagination-container">
                    <el-pagination
                        background
                        layout="total, prev, pager, next, jumper"
                        :current-page.sync="pagination.currentPage"
                        :page-size="pagination.pageSize"
                        :total="pagination.total"
                        @current-change="handleCurrentChange">
                    </el-pagination>
                </div>
            </div>

            <!-- 新增弹窗：基本信息 + 检查项勾选 -->
            <div class="add-form">
                <el-dialog title="新增检查组" :visible.sync="dialogFormVisible" custom-class="unified-dialog" width="720px">
                    <el-tabs v-model="activeName">
                        <el-tab-pane label="基本信息" name="first">
                            <el-form label-position="right" label-width="100px">
                                <el-row>
                                    <el-col :span="12">
                                        <el-form-item label="编码">
                                            <el-input v-model="formData.code" style="width: 293px;"></el-input>
                                        </el-form-item>
                                    </el-col>
                                    <el-col :span="12">
                                        <el-form-item label="名称">
                                            <el-input v-model="formData.name" style="width: 293px;"></el-input>
                                        </el-form-item>
                                    </el-col>
                                </el-row>
                                <el-row>
                                    <el-col :span="12">
                                        <el-form-item label="适用性别">
                                            <el-select v-model="formData.sex" style="width: 293px;">
                                                <el-option label="不限" value="0"></el-option>
                                                <el-option label="男" value="1"></el-option>
                                                <el-option label="女" value="2"></el-option>
                                            </el-select>
                                        </el-form-item>
                                    </el-col>
                                    <el-col :span="12">
                                        <el-form-item label="助记码">
                                            <el-input v-model="formData.helpCode" style="width: 293px;"></el-input>
                                        </el-form-item>
                                    </el-col>
                                </el-row>
                                <el-row>
                                    <el-col :span="24">
                                        <el-form-item label="说明">
                                            <el-input v-model="formData.remark" type="textarea"></el-input>
                                        </el-form-item>
                                    </el-col>
                                </el-row>
                                <el-row>
                                    <el-col :span="24">
                                        <el-form-item label="注意事项">
                                            <el-input v-model="formData.attention" type="textarea"></el-input>
                                        </el-form-item>
                                    </el-col>
                                </el-row>
                            </el-form>
                        </el-tab-pane>
                        <el-tab-pane label="检查项信息" name="second">
                            <el-table :data="tableData" size="small" max-height="300">
                                <el-table-column width="60" align="center">
                                    <template slot-scope="scope">
                                        <el-checkbox :label="scope.row.id" v-model="scope.row.checked"></el-checkbox>
                                    </template>
                                </el-table-column>
                                <el-table-column prop="code" label="项目编码" align="left"></el-table-column>
                                <el-table-column prop="name" label="项目名称" align="left"></el-table-column>
                                <el-table-column prop="remark" label="项目说明" align="left" show-overflow-tooltip></el-table-column>
                            </el-table>
                        </el-tab-pane>
                    </el-tabs>
                    <div slot="footer" class="dialog-footer">
                        <el-button @click="dialogFormVisible = false">取消</el-button>
                        <el-button type="primary" @click="handleAdd()">确定</el-button>
                    </div>
                </el-dialog>
            </div>

            <!-- 编辑弹窗 -->
            <div class="add-form">
                <el-dialog title="编辑检查组" :visible.sync="dialogFormVisible4Edit" custom-class="unified-dialog" width="720px">
                    <el-tabs v-model="activeName">
                        <el-tab-pane label="基本信息" name="first">
                            <el-form label-position="right" label-width="100px">
                                <el-row>
                                    <el-col :span="12">
                                        <el-form-item label="编码">
                                            <el-input v-model="formData.code" style="width: 293px;"></el-input>
                                        </el-form-item>
                                    </el-col>
                                    <el-col :span="12">
                                        <el-form-item label="名称">
                                            <el-input v-model="formData.name" style="width: 293px;"></el-input>
                                        </el-form-item>
                                    </el-col>
                                </el-row>
                                <el-row>
                                    <el-col :span="12">
                                        <el-form-item label="适用性别">
                                            <el-select v-model="formData.sex" style="width: 293px;">
                                                <el-option label="不限" value="0"></el-option>
                                                <el-option label="男" value="1"></el-option>
                                                <el-option label="女" value="2"></el-option>
                                            </el-select>
                                        </el-form-item>
                                    </el-col>
                                    <el-col :span="12">
                                        <el-form-item label="助记码">
                                            <el-input v-model="formData.helpCode" style="width: 293px;"></el-input>
                                        </el-form-item>
                                    </el-col>
                                </el-row>
                                <el-row>
                                    <el-col :span="24">
                                        <el-form-item label="说明">
                                            <el-input v-model="formData.remark" type="textarea"></el-input>
                                        </el-form-item>
                                    </el-col>
                                </el-row>
                                <el-row>
                                    <el-col :span="24">
                                        <el-form-item label="注意事项">
                                            <el-input v-model="formData.attention" type="textarea"></el-input>
                                        </el-form-item>
                                    </el-col>
                                </el-row>
                            </el-form>
                        </el-tab-pane>
                        <el-tab-pane label="检查项信息" name="second">
                            <el-table :data="tableData" size="small" max-height="300">
                                <el-table-column width="60" align="center">
                                    <template slot-scope="scope">
                                        <el-checkbox :label="scope.row.id" v-model="scope.row.checked"></el-checkbox>
                                    </template>
                                </el-table-column>
                                <el-table-column prop="code" label="项目编码" align="left"></el-table-column>
                                <el-table-column prop="name" label="项目名称" align="left"></el-table-column>
                                <el-table-column prop="remark" label="项目说明" align="left" show-overflow-tooltip></el-table-column>
                            </el-table>
                        </el-tab-pane>
                    </el-tabs>
                    <div slot="footer" class="dialog-footer">
                        <el-button @click="dialogFormVisible4Edit = false">取消</el-button>
                        <el-button type="primary" @click="handleEdit()">确定</el-button>
                    </div>
                </el-dialog>
            </div>
        </div>

        <!-- 引入组件库 -->
        <script src="../js/vue.js"></script>
        <script src="../plugins/elementui/index.js"></script>
        <script type="text/javascript" src="../js/jquery.min.js"></script>
        <script src="../js/axios-0.18.0.js"></script>
        <script src="../js/config.js"></script>
        <script src="../js/api.js"></script>
        <script>
            let vue = new Vue({
                el: '#app',
                data: {
                    pagination: {
                        currentPage: 1,
                        pageSize: 10,
                        total: 100,
                        queryString: null
                    },
                    dataList: [],
                    formData: {},
                    tableData: [],
                    checkitemIds: [],
                    dialogFormVisible: false,
                    dialogFormVisible4Edit: false,
                    activeName: 'first'
                },
                created() {
                    this.findPage();
                },
                methods: {
                    // 收集勾选的检查项 id（基于 tableData 的 checked 状态）
                    collectCheckitemIds() {
                        return this.tableData.filter(item => item.checked).map(item => item.id);
                    },
                    handleEdit() {
                        axios.post(`/checkGroup/updateCheckGroup.do?ids=${this.collectCheckitemIds()}`, this.formData).then(response => {
                            if (response.data.flag) {
                                this.dialogFormVisible4Edit = false;
                                this.$message.success("更新成功！");
                                this.findPage();
                            } else {
                                this.$message.error(response.data.message);
                            }
                        })
                    },
                    handleAdd() {
                        axios.post(`/checkGroup/addCheckGroup.do?ids=${this.collectCheckitemIds()}`, this.formData).then(response => {
                            if (response.data.flag) {
                                this.dialogFormVisible = false;
                                this.$message.success("添加成功！");
                                this.checkitemIds = [];
                                this.findPage();
                            } else {
                                this.$message.error(response.data.message);
                            }
                        });
                    },
                    findPage() {
                        let params = {
                            currentPage: this.pagination.currentPage,
                            pageSize: this.pagination.pageSize,
                            queryString: this.pagination.queryString
                        };
                        axios.post(`/checkGroup/findByPage.do`, params).then(response => {
                            this.dataList = response.data.rows;
                            this.pagination.total = response.data.total;
                        });
                    },
                    handleCreate() {
                        this.dialogFormVisible = true;
                        this.formData = {};
                        this.activeName = "first";
                        axios.get(`/checkItem/findAll.do`).then(response => {
                            this.tableData = (response.data || []).map(item => Object.assign({ checked: false }, item));
                        });
                    },
                    handleUpdate(row) {
                        this.dialogFormVisible4Edit = true;
                        this.activeName = "first";
                        let id = row.id;
                        axios.get(`/checkItem/findAll.do`).then(response => {
                            this.tableData = (response.data || []).map(item => Object.assign({ checked: false }, item));
                        });
                        // 已勾选的检查项回显
                        axios.get(`/checkGroup/findById.do?id=${id}`).then(response => {
                            let checkedIds = (response.data || []).map(item => item.id);
                            this.tableData.forEach(item => {
                                if (checkedIds.indexOf(item.id) > -1) {
                                    item.checked = true;
                                }
                            });
                        });
                        // 检查组基本信息
                        axios.get(`/checkGroup/findCheckGroupById.do?id=${id}`).then(response => {
                            this.formData = response.data;
                        })
                    },
                    handleCurrentChange(currentPage) {
                        this.pagination.currentPage = currentPage;
                        this.findPage();
                    },
                    handleDelete(row) {
                        let id = row.id;
                        this.$confirm('是否删除该检查组？删除将同时解除其下检查项的关联。', '提示', {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning'
                        }).then(() => {
                            axios.post(`/checkGroup/deleteCheckGroup.do?id=${id}`).then(response => {
                                if (response.data.flag) {
                                    this.$message.success("删除成功！");
                                    this.findPage();
                                } else {
                                    this.$message.error(response.data.message);
                                }
                            });
                        }).catch(() => {
                        });
                    }
                }
            })
        </script>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>心飞健康 · 管理后台</title>
        <meta name="description" content="心飞健康">
        <meta name="keywords" content="心飞健康">
        <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">
        <link rel="stylesheet" href="../plugins/elementui/index.css">
        <link rel="stylesheet" href="../plugins/font-awesome/css/font-awesome.min.css">
        <link rel="stylesheet" href="../css/tokens.css">
        <style>
            * { margin: 0; padding: 0; }
            html, body { height: 100%; overflow: hidden; }
            body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }

            /* 顶栏 */
            .main-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                height: 56px;
                background: #fff;
                border-bottom: 1px solid var(--border-base);
                padding: 0 var(--space-4);
            }
            .main-header .header-logo { display: flex; align-items: center; gap: var(--space-2); }
            .main-header .header-logo img { height: 32px; }
            .main-header .header-logo span { font-size: var(--font-size-md); font-weight: 600; color: var(--text-title); }
            .right-menu { display: flex; align-items: center; gap: var(--space-4); }
            .right-menu .help { font-size: var(--font-size-sm); color: var(--text-secondary); cursor: pointer; }
            .right-menu .help:hover { color: var(--brand-primary); }
            .avatar-wrapper { display: flex; align-items: center; gap: var(--space-2); cursor: pointer; font-size: var(--font-size-sm); color: var(--text-body); }
            .user-avatar { width: 28px; height: 28px; border-radius: 50%; }

            /* 侧边栏 */
            .el-aside {
                background: #fff;
                border-right: 1px solid var(--border-base);
                overflow-y: auto;
                height: calc(100vh - 56px);
            }
            .el-aside .el-menu { border-right: none; }
            .el-aside a { text-decoration: none; color: var(--text-body); display: block; }
            .el-menu-item.is-active a { color: var(--brand-primary); }
            .el-menu-item:hover, .el-submenu__title:hover { background: var(--brand-primary-light); }

            /* 主内容区 */
            .main-container { height: calc(100vh - 56px); overflow: hidden; }
            .el-main {
                position: absolute;
                top: 56px;
                bottom: 0;
                left: 200px;
                right: 0;
                padding: 0;
            }
        </style>
    </head>
    <body>
        <div id="app">
            <el-container>
                <!-- 顶栏 -->
                <el-header class="main-header" style="height:56px;">
                    <div class="header-logo">
                        <img src="../img/logo.svg" alt="心飞健康">
                        <span>心飞健康</span>
                    </div>
                    <div class="right-menu">
                        <span class="help"><i class="fa fa-question-circle-o" aria-hidden="true"></i> 帮助</span>
                        <el-dropdown class="avatar-container right-menu-item" trigger="click">
                            <div class="avatar-wrapper">
                                <img src="../img/avatar.png" class="user-avatar">
                                {{ username }}
                            </div>
                            <el-dropdown-menu slot="dropdown">
                                <el-dropdown-item divided>
                                    <span style="display:block;">修改密码</span>
                                </el-dropdown-item>
                                <el-dropdown-item divided>
                                    <span style="display:block;" @click="doLogout">退出登录</span>
                                </el-dropdown-item>
                            </el-dropdown-menu>
                        </el-dropdown>
                    </div>
                </el-header>
                <el-container class="main-container">
                    <!-- 侧边导航 -->
                    <el-aside width="200px">
                        <el-menu>
                            <el-submenu v-for="menu in menuList" :key="menu.path" :index="menu.path">
                                <template slot="title">
                                    <i class="fa" :class="menu.icon"></i>
                                    {{ menu.title }}
                                </template>
                                <el-menu-item v-for="child in menu.children" :key="child.path" :index="child.path">
                                    <a :href="child.linkUrl" target="right">{{ child.title }}</a>
                                </el-menu-item>
                            </el-submenu>
                        </el-menu>
                    </el-aside>
                    <!-- 内容区 -->
                    <el-container>
                        <iframe name="right" class="el-main" src="main.html" width="100%" height="100%" frameborder="0"></iframe>
                    </el-container>
                </el-container>
            </el-container>
        </div>
        <!-- 引入组件库 -->
        <script src="../js/vue.js"></script>
        <script src="../plugins/elementui/index.js"></script>
        <script src="/js/axios-0.18.0.js"></script>
        <script src="/js/config.js"></script>
        <script src="/js/api.js"></script>
        <script type="text/javascript" src="../js/jquery.min.js"></script>
        <script>
            new Vue({
                el: '#app',
                data: {
                    menuList: [
                        {
                            "path": "1",
                            "title": "工作台",
                            "icon": "fa-dashboard",
                            "children": []
                        },
                        {
                            "path": "2",
                            "title": "会员管理",
                            "icon": "fa-user-md",
                            "children": [
                                { "path": "/2-1", "title": "会员档案", "linkUrl": "member.html", "children": [] },
                                { "path": "/2-2", "title": "体检上传", "linkUrl": "examinationupload.html", "children": [] },
                                { "path": "/2-3", "title": "会员统计", "linkUrl": "all-item-list.html", "children": [] }
                            ]
                        },
                        {
                            "path": "3",
                            "title": "预约管理",
                            "icon": "fa-tty",
                            "children": [
                                { "path": "/3-1", "title": "预约列表", "linkUrl": "ordersettinglist.html", "children": [] },
                                { "path": "/3-2", "title": "预约设置", "linkUrl": "ordersetting.html", "children": [] },
                                { "path": "/3-3", "title": "套餐管理", "linkUrl": "setmeal.html", "children": [] },
                                { "path": "/3-4", "title": "检查组管理", "linkUrl": "checkgroup.html", "children": [] },
                                { "path": "/3-5", "title": "检查项管理", "linkUrl": "checkitem.html", "children": [] }
                            ]
                        },
                        {
                            "path": "4",
                            "title": "健康评估",
                            "icon": "fa-stethoscope",
                            "children": [
                                { "path": "/4-1", "title": "中医体质辨识", "linkUrl": "all-medical-list.html", "children": [] }
                            ]
                        },
                        {
                            "path": "5",
                            "title": "统计分析",
                            "icon": "fa-heartbeat",
                            "children": [
                                { "path": "/5-1", "title": "工作量统计", "linkUrl": "all-medical-list.html", "children": [] },
                                { "path": "/5-2", "title": "用户统计", "linkUrl": "report_member.html", "children": [] },
                                { "path": "/5-3", "title": "套餐占比统计", "linkUrl": "report_setmeal.html", "children": [] },
                                { "path": "/5-4", "title": "运营数据统计", "linkUrl": "report_business.html", "children": [] }
                            ]
                        }
                    ],
                    username: ''
                },
                created() {
                    // 用户名接口未实现时退回登录时记录的名字，两者都没有就提示未登录
                    this.username = XfjkAuth.username() || '未登录';
                    axios.get(`/user/findUsername.do`).then(response => {
                        this.username = response.data.username || this.username;
                    }).catch(() => {});
                },
                methods: {
                    doLogout() {
                        // 后端登出接口是 POST /auth/logout；无论成功与否都要清本地令牌
                        axios.post('/auth/logout').catch(() => {}).then(() => {
                            XfjkAuth.signout();
                            window.location.href = (window.XfjkConfig && window.XfjkConfig.loginPage) || '/login.html';
                        });
                    }
                }
            });
            $(function() {
                let wd = 200;
                $(".el-main").css('width', $('body').width() - wd + 'px');
            });
        </script>
    </body>
</html>

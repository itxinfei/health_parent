<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>心飞健康 · 会员档案</title>
        <meta name="description" content="心飞健康">
        <meta name="keywords" content="心飞健康">
        <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">
        <link rel="stylesheet" href="../plugins/elementui/index.css">
        <link rel="stylesheet" href="../plugins/font-awesome/css/font-awesome.min.css">
        <link rel="stylesheet" href="../css/tokens.css">
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body class="hold-transition">
        <div id="app" class="page-wrap">
            <h1 class="page-title">会员档案</h1>

            <!-- 筛选卡片 -->
            <div class="page-card">
                <el-form :inline="true" size="small" @submit.native.prevent>
                    <el-form-item>
                        <el-input placeholder="姓名 / 手机号 / 身份证号" v-model="pagination.queryString" style="width: 240px;" clearable @clear="findPage()" @keyup.enter.native="findPage()"></el-input>
                    </el-form-item>
                    <el-form-item>
                        <el-select v-model="statusFilter" placeholder="会员状态" clearable style="width: 140px;" @change="findPage()">
                            <el-option label="正常" value="1"></el-option>
                            <el-option label="停用" value="0"></el-option>
                        </el-select>
                    </el-form-item>
                    <el-form-item>
                        <el-button icon="el-icon-search" @click="findPage()">查询</el-button>
                        <el-button type="primary" icon="el-icon-plus" @click="handleCreate()">新建会员</el-button>
                    </el-form-item>
                </el-form>
            </div>

            <!-- 表格卡片 -->
            <div class="page-card">
                <div class="page-card-header">
                    <span class="page-card-title">会员列表</span>
                    <span class="list-total">共 {{ pagination.total }} 条</span>
                </div>
                <el-table size="small" :data="dataList" highlight-current-row>
                    <el-table-column type="index" label="序号" width="60" align="center"></el-table-column>
                    <el-table-column prop="name" label="姓名" align="left"></el-table-column>
                    <el-table-column label="性别" align="center" width="70">
                        <template slot-scope="scope">
                            <span>{{ scope.row.sex == '1' ? '男' : '女' }}</span>
                        </template>
                    </el-table-column>
                    <el-table-column prop="age" label="年龄" align="center" width="70" class-name="num"></el-table-column>
                    <el-table-column prop="phoneNumber" label="手机号" align="left" width="130"></el-table-column>
                    <el-table-column prop="idCard" label="身份证号" align="left" width="180"></el-table-column>
                    <el-table-column prop="registrationDate" label="建档日期" align="center" width="120"></el-table-column>
                    <el-table-column label="状态" align="center" width="80">
                        <template slot-scope="scope">
                            <el-tag :type="scope.row.status == '1' ? 'success' : 'info'" size="mini">{{ scope.row.status == '1' ? '正常' : '停用' }}</el-tag>
                        </template>
                    </el-table-column>
                    <el-table-column label="操作" align="center" width="160">
                        <template slot-scope="scope">
                            <el-button type="text" class="op-primary" @click="handleUpdate(scope.row)">编辑</el-button>
                            <el-button type="text" class="op-danger" @click="handleDelete(scope.row)">删除</el-button>
                        </template>
                    </el-table-column>
                </el-table>
                <div class="pagination-container">
                    <el-pagination
                        background
                        layout="total, prev, pager, next, jumper"
                        :current-page.sync="pagination.currentPage"
                        :page-size="pagination.pageSize"
                        :total="pagination.total"
                        @current-change="handleCurrentChange">
                    </el-pagination>
                </div>
            </div>

            <!-- 新增/编辑弹窗 -->
            <div class="add-form">
                <el-dialog :title="formData.id == null ? '新建会员' : '编辑会员'" :visible.sync="dialogFormVisible" custom-class="unified-dialog" width="560px">
                    <el-form ref="dataForm" :model="formData" :rules="rules" label-position="right" label-width="100px">
                        <el-row>
                            <el-col :span="12">
                                <el-form-item label="姓名" prop="name">
                                    <el-input v-model="formData.name" style="width: 293px;"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="性别">
                                    <el-select v-model="formData.sex" style="width: 293px;">
                                        <el-option label="男" value="1"></el-option>
                                        <el-option label="女" value="2"></el-option>
                                    </el-select>
                                </el-form-item>
                            </el-col>
                        </el-row>
                        <el-row>
                            <el-col :span="12">
                                <el-form-item label="手机号" prop="phoneNumber">
                                    <el-input v-model="formData.phoneNumber" style="width: 293px;"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="身份证号">
                                    <el-input v-model="formData.idCard" style="width: 293px;"></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>
                        <el-row>
                            <el-col :span="12">
                                <el-form-item label="建档日期">
                                    <el-date-picker v-model="formData.registrationDate" type="date" value-format="yyyy-MM-dd" style="width: 293px;"></el-date-picker>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="会员状态">
                                    <el-select v-model="formData.status" style="width: 293px;">
                                        <el-option label="正常" value="1"></el-option>
                                        <el-option label="停用" value="0"></el-option>
                                    </el-select>
                                </el-form-item>
                            </el-col>
                        </el-row>
                        <el-row>
                            <el-col :span="24">
                                <el-form-item label="备注">
                                    <el-input v-model="formData.remark" type="textarea"></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>
                    </el-form>
                    <div slot="footer" class="dialog-footer">
                        <el-button @click="dialogFormVisible = false">取消</el-button>
                        <el-button type="primary" @click="handleSave()">确定</el-button>
                    </div>
                </el-dialog>
            </div>
        </div>

        <!-- 引入组件库 -->
        <script src="../js/vue.js"></script>
        <script src="../plugins/elementui/index.js"></script>
        <script type="text/javascript" src="../js/jquery.min.js"></script>
        <script src="../js/axios-0.18.0.js"></script>
        <script src="../js/config.js"></script>
        <script src="../js/api.js"></script>
        <script>
            let vue = new Vue({
                el: '#app',
                data: {
                    pagination: {
                        currentPage: 1,
                        pageSize: 10,
                        total: 0,
                        queryString: null
                    },
                    statusFilter: null,
                    dataList: [],
                    formData: {},
                    dialogFormVisible: false,
                    rules: {
                        name: [{ required: true, message: '姓名为必填项', trigger: 'blur' }],
                        phoneNumber: [
                            { required: true, message: '手机号为必填项', trigger: 'blur' },
                            { pattern: /^1[3-9]\d{9}$/, message: '手机号格式不正确', trigger: 'blur' }
                        ]
                    }
                },
                created() {
                    this.findPage();
                },
                methods: {
                    // 分页查询（后端会员接口就绪前使用占位数据，接口路径见文档 07）
                    findPage() {
                        // TODO: 接入后端会员接口后替换为 axios 请求（文档 07 接口清单）
                        this.dataList = [
                            { id: 1, name: '张三', sex: '1', age: 32, phoneNumber: '13800000001', idCard: '440101199001010011', registrationDate: '2026-10-01', status: '1' },
                            { id: 2, name: '李四', sex: '2', age: 28, phoneNumber: '13800000002', idCard: '440101199202020022', registrationDate: '2026-10-08', status: '1' },
                            { id: 3, name: '王五', sex: '1', age: 45, phoneNumber: '13800000003', idCard: '440101198105050033', registrationDate: '2026-10-15', status: '0' }
                        ];
                        this.pagination.total = this.dataList.length;
                    },
                    handleCreate() {
                        this.formData = { status: '1', registrationDate: new Date().toISOString().slice(0, 10) };
                        this.dialogFormVisible = true;
                    },
                    handleUpdate(row) {
                        this.formData = Object.assign({}, row);
                        this.dialogFormVisible = true;
                    },
                    handleSave() {
                        this.$refs['dataForm'].validate(valid => {
                            if (valid) {
                                // TODO: 接入后端会员接口后替换为 axios 保存请求
                                this.dialogFormVisible = false;
                                this.$message.success('保存成功（占位，接口待接入）');
                                this.findPage();
                            } else {
                                this.$message.error('表单数据校验失败');
                                return false;
                            }
                        })
                    },
                    handleCurrentChange(currentPage) {
                        this.pagination.currentPage = currentPage;
                        this.findPage();
                    },
                    handleDelete(row) {
                        this.$confirm('是否删除会员「' + row.name + '」的档案？删除后不可恢复。', '提示', {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning'
                        }).then(() => {
                            // TODO: 接入后端会员接口后替换为 axios 删除请求
                            this.$message.success('删除成功（占位，接口待接入）');
                            this.findPage();
                        }).catch(() => {
                        });
                    }
                }
            })
        </script>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>心飞健康 · 会员统计</title>
        <meta name="description" content="心飞健康">
        <meta name="keywords" content="心飞健康">
        <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">
        <link rel="stylesheet" href="../plugins/elementui/index.css">
        <link rel="stylesheet" href="../plugins/font-awesome/css/font-awesome.min.css">
        <link rel="stylesheet" href="../css/tokens.css">
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body class="hold-transition">
        <div id="app" class="page-wrap">
            <div class="report-header">
                <h1 class="page-title" style="margin-bottom: 0;">会员统计</h1>
                <span class="list-total">统计维度：会员性别与年龄分布</span>
            </div>

            <!-- 汇总卡片 -->
            <div class="page-card">
                <div class="stat-row">
                    <div class="stat-cell">
                        <div class="stat-label">会员总数</div>
                        <div class="stat-value">{{ summary.total }}</div>
                    </div>
                    <div class="stat-cell">
                        <div class="stat-label">男会员</div>
                        <div class="stat-value">{{ summary.male }}</div>
                    </div>
                    <div class="stat-cell">
                        <div class="stat-label">女会员</div>
                        <div class="stat-value">{{ summary.female }}</div>
                    </div>
                    <div class="stat-cell">
                        <div class="stat-label">平均年龄</div>
                        <div class="stat-value">{{ summary.avgAge }}</div>
                    </div>
                </div>
            </div>

            <!-- 分布图 -->
            <div class="page-card">
                <div class="page-card-header">
                    <span class="page-card-title">年龄分布</span>
                </div>
                <div id="ageChart" style="width: 100%; height: 360px;"></div>
            </div>

            <!-- 明细表 -->
            <div class="page-card">
                <div class="page-card-header">
                    <span class="page-card-title">会员明细</span>
                </div>
                <el-table size="small" :data="memberList" highlight-current-row>
                    <el-table-column type="index" label="序号" width="60" align="center"></el-table-column>
                    <el-table-column prop="name" label="姓名" align="left"></el-table-column>
                    <el-table-column prop="age" label="年龄" align="center" width="80" class-name="num"></el-table-column>
                    <el-table-column prop="phoneNumber" label="手机号" align="left" width="140"></el-table-column>
                    <el-table-column prop="registrationDate" label="建档日期" align="center" width="120"></el-table-column>
                </el-table>
            </div>
        </div>
    </body>
    <!-- 引入组件库 -->
    <script src="../js/vue.js"></script>
    <script src="../plugins/elementui/index.js"></script>
    <script src="../js/echarts.js"></script>
    <script type="text/javascript" src="../js/jquery.min.js"></script>
    <script src="../js/axios-0.18.0.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script>
        // TODO: 后端会员统计接口就绪后替换占位数据（文档 06）
        let vue = new Vue({
            el: '#app',
            data: {
                summary: { total: 0, male: 0, female: 0, avgAge: 0 },
                ageGroups: [
                    { range: '18 岁以下', count: 12 },
                    { range: '18~30 岁', count: 86 },
                    { range: '31~45 岁', count: 154 },
                    { range: '46~60 岁', count: 97 },
                    { range: '60 岁以上', count: 41 }
                ],
                memberList: [
                    { name: '张三', age: 32, phoneNumber: '13800000001', registrationDate: '2026-10-01' },
                    { name: '李四', age: 28, phoneNumber: '13800000002', registrationDate: '2026-10-08' },
                    { name: '王五', age: 45, phoneNumber: '13800000003', registrationDate: '2026-10-15' }
                ]
            },
            computed: {
                totalAge() {
                    return this.ageGroups.reduce((a, b) => a + b.count, 0);
                }
            },
            created() {
                // 由占位年龄分布推算汇总
                this.summary.total = this.totalAge;
                this.summary.male = Math.round(this.totalAge * 0.54);
                this.summary.female = this.totalAge - this.summary.male;
                this.summary.avgAge = 41;
                this.renderChart();
            },
            methods: {
                renderChart() {
                    let chart = echarts.init(document.getElementById('ageChart'));
                    chart.setOption({
                        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                        grid: { left: 48, right: 24, top: 24, bottom: 40 },
                        xAxis: {
                            type: 'category',
                            data: this.ageGroups.map(g => g.range),
                            axisLine: { lineStyle: { color: '#e5e6eb' } },
                            axisLabel: { color: '#86909c', fontSize: 12 },
                            axisTick: { show: false }
                        },
                        yAxis: {
                            type: 'value',
                            axisLine: { show: false },
                            axisLabel: { color: '#86909c', fontSize: 12 },
                            splitLine: { lineStyle: { color: '#f2f3f5' } }
                        },
                        series: [{
                            name: '会员数量',
                            type: 'bar',
                            barMaxWidth: 40,
                            data: this.ageGroups.map(g => g.count),
                            itemStyle: { color: '#00A870', borderRadius: [4, 4, 0, 0] }
                        }]
                    });
                    window.addEventListener('resize', () => chart.resize());
                }
            }
        })
    </script>
</html>
